<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FarmVista • Grain Operations Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#3B7E46"/>
  <script src="/js/app/theme-boot.js"></script>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
  <link rel="icon" href="/assets/icons/icon-192.png"/>
  <link rel="stylesheet" href="/assets/css/theme.css"/>
  <link rel="stylesheet" href="/assets/css/app.css"/>
  <script src="/js/app/version.js" defer></script>
  <script src="/js/app/core.js" defer></script>
  <script src="/js/app/fv-shell.js" defer></script>
</head>
<body>
  <div id="fv-shell"></div>
  <main class="app-main">
    <div id="grain-operations-central"><div style="padding:24px;text-align:center">Loading centralized Grain Operations…</div></div>
  </main>
  <script type="module">
    import {installLandscapeLock} from '/js/grain/operations/ui/landscape-lock.js?v=20260917-1';
    import {mountGrainOperations} from '/js/grain/operations/ui/workspace-renderer.js?v=20260917-4';
    installLandscapeLock();
    mountGrainOperations(document.getElementById('grain-operations-central')).catch(error=>{
      console.error(error);
      document.getElementById('grain-operations-central').innerHTML='<div style="padding:24px;color:#9d241e;font-weight:800">Central Grain Operations failed to start. Check console.</div>';
    });
  </script>
</body>
</html>

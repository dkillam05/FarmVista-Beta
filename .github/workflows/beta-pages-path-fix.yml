name: Beta GitHub Pages path compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta-pages-path-fix.yml'
      - 'beta-run-marker.txt'

permissions:
  contents: write

jobs:
  fix-beta-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite root-relative FarmVista paths for project Pages
        shell: python
        run: |
          from pathlib import Path
          import re
          ROOT = Path('.')
          PREFIX = '/FarmVista-Beta/'
          TEXT_EXTS = {'.html','.js','.css','.json','.webmanifest','.md','.txt','.xml'}
          SKIP = {'.git', '.github'}
          changed = []
          for p in ROOT.rglob('*'):
              if not p.is_file() or any(part in SKIP for part in p.parts):
                  continue
              if p.suffix.lower() not in TEXT_EXTS and p.name != 'serviceworker.js':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s
              s = re.sub(r'<base\s+href=["\']/["\']\s*/?>', '<base href="/FarmVista-Beta/">', s, flags=re.I)
              for folder in ('js','assets','pages','scan','farms','marketing','docs'):
                  s = re.sub(r'(?<![A-Za-z0-9_./-])/(' + folder + r')/', PREFIX + r'\1/', s)
              for fname in ('manifest.webmanifest','serviceworker.js','index.html'):
                  s = re.sub(r'(?<![A-Za-z0-9_./-])/' + re.escape(fname), PREFIX + fname, s)
              s = s.replace('/FarmVista-Beta/FarmVista-Beta/', '/FarmVista-Beta/')
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print(f'Updated {len(changed)} files')
          for f in changed:
              print(f)

      - name: Commit Beta-only compatibility changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github'
          if git diff --cached --quiet; then
            echo "No path changes required."
          else
            git commit -m "Fix FarmVista Beta paths for GitHub Pages"
            git push origin main
          fi

name: Fix Beta login farm config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-beta-login-config.yml'

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make farm config path Beta-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app/login.js')
          s = p.read_text()
          old = "  const configPath =\n    String(\n      farm?.configPath ||\n      `/FarmVista-Beta/farms/${farmKey}.json`\n    ).trim();\n"
          new = "  // Beta must always load the farm config from this GitHub Pages repository.\n  // Platform lookup paths are production-root-relative and are not safe here.\n  const configPath =\n    new URL(\n      `farms/${encodeURIComponent(farmKey)}.json`,\n      document.baseURI || location.href\n    ).pathname;\n"
          if old not in s:
              raise SystemExit('Expected selectFarm configPath block was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit Beta login fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app/login.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Beta login farm configuration path"
          git push origin main

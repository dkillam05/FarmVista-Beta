name: Reorganize Dashboard JS

on:
  push:
    paths:
      - '.github/workflows/reorganize-dashboard-js.yml'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Move dashboard modules and rewrite references
        run: python .github/scripts/reorganize-dashboard-js.py
      - name: Commit reorganization
        run: |
          git config user.name "FarmVista Beta Organizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Organize dashboard JavaScript by feature"
          git push

# One-time migration workflow; remove after successful reorganization.

name: Auto bump FarmVista version

# Beta intentionally does not auto-bump versions. This prevents Beta-only
# compatibility/deployment commits from racing application test commits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-version-note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic FarmVista version bumps are disabled in FarmVista-Beta."

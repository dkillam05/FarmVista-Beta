name: Sync live FarmVista main into Beta

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-live-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot live main
        run: |
          git clone --depth 1 --branch main https://github.com/dkillam05/Farm-vista.git /tmp/farmvista-live
          rsync -a --delete --exclude='.git' /tmp/farmvista-live/ ./

      - name: Commit exact live snapshot to Beta
        run: |
          git config user.name 'FarmVista Beta Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Beta already matches live main.'
          else
            git commit -m 'Reset Beta to live FarmVista main snapshot - 2026-09-16'
            git push origin HEAD:main
          fi
# trigger 2026-09-16

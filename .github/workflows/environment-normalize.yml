name: Normalize FarmVista for custom-domain deployment

on:
  push:
    paths:
      - 'environment-normalize-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove repository-subpath assumptions
        shell: python
        run: |
          from pathlib import Path
          ROOT = Path('.')
          TEXT_EXTS = {'.html','.js','.css','.json','.webmanifest','.md','.txt','.xml','.yml','.yaml'}
          SKIP = {'.git', '.github'}
          changed = []
          for p in ROOT.rglob('*'):
              if not p.is_file() or any(part in SKIP for part in p.parts):
                  continue
              if p.suffix.lower() not in TEXT_EXTS and p.name != 'serviceworker.js':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              old = s
              s = s.replace('/FarmVista-Beta/', '/')
              s = s.replace('/FarmVista-Beta', '/')
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print(f'Normalized {len(changed)} files')
          for f in changed:
              print(f)

      - name: Verify no Beta subpath remains in app files
        shell: bash
        run: |
          if grep -R --exclude-dir=.git --exclude-dir=.github -n '/FarmVista-Beta' .; then
            echo 'Beta subpath references remain.'
            exit 1
          fi

      - name: Commit normalized application paths
        shell: bash
        run: |
          git config user.name 'FarmVista Environment Setup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!.github'
          if git diff --cached --quiet; then
            echo 'No normalization changes needed.'
            exit 0
          fi
          git commit -m 'Normalize FarmVista paths for custom-domain environments'
          git pull --rebase origin main
          git push origin HEAD:main
